{% extends "base.html" %}

{% block content %}
<h1>Статистика посещений по страницам</h1>
<table class="table table-striped">
    <thead>
        <tr>
            <th>№</th>
            <th>Страница</th>
            <th>Количество посещений</th>
        </tr>
    </thead>
    <tbody>
        {% for stat in stats %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ stat.path }}</td>
            <td>{{ stat.count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{ url_for('reports.export_pages_csv') }}" class="btn btn-success">Экспорт в CSV</a>
<a href="{{ url_for('reports.visit_logs') }}" class="btn btn-secondary">Назад к журналу</a>
{% endblock %}
